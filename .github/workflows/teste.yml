name: Testes

# Roda a cada mudança no código:
#  * motor-linux:    testes de ponta a ponta com o whisper.cpp de verdade e fala em português
#  * termux-aarch64: o instalador dentro de um Termux de verdade (arquitetura de celular, aarch64)
on:
  push:
    paths-ignore: ["**.md", "transcricoes/**"]
  pull_request:
    paths-ignore: ["**.md", "transcricoes/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

env:
  WHISPER_VERSAO: v1.9.5
  # "Primeira Catilinária" (Antologia de Discursos em Português, LibriVox, domínio público)
  AMOSTRA_URL: https://archive.org/download/antologia_de_discursos_em_portugues_1402_librivox/antologia_de_discursos_em_portugues_07_various_64kb.mp3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning instalar.sh tce/tce testes/rodar.sh testes/termux-ci.sh
      - name: Python compila
        run: python3 -m py_compile tce/motor.py tce/tce_windows.py testes/yt-dlp-falso

  motor-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Cache do whisper.cpp
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: ~/whisper-bin
          key: whisper-${{ env.WHISPER_VERSAO }}-${{ runner.os }}-${{ runner.arch }}-avx2-v1
      - name: Compilar whisper.cpp
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --quiet --branch "$WHISPER_VERSAO" https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/wb -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON \
            -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON >/dev/null
          cmake --build /tmp/wb -j "$(nproc)" --target whisper-cli >/dev/null
          mkdir -p ~/whisper-bin && cp /tmp/wb/bin/whisper-cli ~/whisper-bin/
      - name: Cache dos modelos
        uses: actions/cache@v4
        with:
          path: ~/modelos
          key: modelos-small-vad-v1
      - name: Baixar modelo e amostra
        run: |
          mkdir -p ~/modelos
          [ -s ~/modelos/ggml-small-q8_0.bin ] || curl -fsSL -o ~/modelos/ggml-small-q8_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q8_0.bin
          [ -s ~/modelos/ggml-silero-v6.2.0.bin ] || curl -fsSL -o ~/modelos/ggml-silero-v6.2.0.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          curl -fsSL --retry 5 -o /tmp/completo.mp3 "$AMOSTRA_URL"
          ffmpeg -nostdin -loglevel error -y -i /tmp/completo.mp3 -t 300 -c copy /tmp/amostra.mp3
      - name: Testes de ponta a ponta
        env:
          WHISPER: /home/runner/whisper-bin/whisper-cli
          MODELO: /home/runner/modelos/ggml-small-q8_0.bin
          VAD: /home/runner/modelos/ggml-silero-v6.2.0.bin
          AMOSTRA: /tmp/amostra.mp3
          SAIDA_TESTES: /tmp/resultados
          THREADS: "4"
        run: bash testes/rodar.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-linux
          path: /tmp/resultados/saida

  termux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e testar dentro do Termux (aarch64)
        run: |
          mkdir -p saida && chmod 777 saida
          tar -C "$GITHUB_WORKSPACE" --exclude=./saida -cf - . | docker run -i --rm --privileged \
            -v "$PWD/saida:/saida" termux/termux-docker:aarch64 \
            bash -c 'mkdir -p ~/src && tar -C ~/src -xf - && bash ~/src/testes/termux-ci.sh "$0"' "$AMOSTRA_URL"
      - name: Resultado
        if: always()
        run: for f in saida/*.txt; do echo "--- $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-termux
          path: saida

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar com o instalador do Windows (PowerShell 5.1, sem administrador)
        shell: powershell
        env:
          TCE_TESTE: "1"
          TCE_MODELOS: "small"
        run: |
          $env:TCE_FONTE = $env:GITHUB_WORKSPACE
          Get-Content -Raw -Encoding UTF8 instalar.ps1 | Invoke-Expression
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "instalador saiu com $LASTEXITCODE" }
          Get-ChildItem "$env:LOCALAPPDATA\TCETranscritor\whisper" | Select-Object Name, Length | Format-Table
      - name: Transcrever 3 min de fala pelo comando tce (nome com acento)
        shell: powershell
        run: |
          $base = "$env:LOCALAPPDATA\TCETranscritor"
          curl.exe -fsSL --retry 5 -o "$env:TEMP\completo.mp3" $env:AMOSTRA_URL
          $nome = Join-Path $env:TEMP ("Sess" + [char]0x00E3 + "o teste.mp3")
          & "$base\bin\ffmpeg.exe" -nostdin -loglevel error -y -i "$env:TEMP\completo.mp3" -t 180 -c copy $nome
          Add-Content -Path "$base\config.ini" -Value "MODELO_FIEL=small"
          & "$base\tce.cmd" arquivo $nome
          if ($LASTEXITCODE -ne 0) { throw "tce arquivo saiu com $LASTEXITCODE" }
      - name: Conferir o TXT
        shell: powershell
        run: |
          $txt = Get-ChildItem "$env:USERPROFILE\Downloads\TCE-Transcricoes" -Filter *.txt | Select-Object -First 1
          Write-Host $txt.FullName
          Get-Content -Encoding UTF8 $txt.FullName
          if (-not (Select-String -Path $txt.FullName -Pattern 'catilina' -Quiet)) { throw 'não reconheceu a fala' }
          New-Item -ItemType Directory -Force saida | Out-Null
          Copy-Item $txt.FullName saida\
      - name: Comandos do menu
        shell: cmd
        run: |
          call "%LOCALAPPDATA%\TCETranscritor\tce.cmd" ajuda
          call "%LOCALAPPDATA%\TCETranscritor\tce.cmd" modelos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-windows
          path: saida

  macos:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Esperar os binários do Mac na versão que o instalador pede
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          esperado=$(sed -n 's/^VERSAO_BIN_MAC="\([^"]*\)".*/\1/p' instalar.sh)
          echo "versão esperada: $esperado"
          for i in $(seq 1 80); do
            rm -rf "$RUNNER_TEMP/v"
            gh release download binarios-mac --repo "$GITHUB_REPOSITORY" --pattern versao-macos-arm64.txt \
              --dir "$RUNNER_TEMP/v" >/dev/null 2>&1 || true
            v=$(cat "$RUNNER_TEMP/v/versao-macos-arm64.txt" 2>/dev/null || true)
            [ "$v" = "$esperado" ] && { echo "binários prontos: $v"; exit 0; }
            echo "publicada: ${v:-nenhuma}; esperando..."
            sleep 30
          done
          echo "os binários do Mac nessa versão não foram publicados"; exit 1
      - name: Instalar no Mac (bash do sistema, sem admin, sem Homebrew)
        env:
          TCE_TESTE: "1"
          TCE_MODELOS: "small"
        run: |
          mkdir -p ~/Downloads
          TCE_FONTE="$GITHUB_WORKSPACE" /bin/bash instalar.sh
          head -2 ~/.local/bin/tce
      - name: Transcrever 3 min de fala pelo comando tce
        timeout-minutes: 20
        run: |
          grep -E '^(WHISPER_EXTRA|MODELO_AOVIVO|MODELO_FIEL)=' ~/.config/tce/config
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/completo.mp3" "$AMOSTRA_URL"
          ~/.local/share/tce/bin/ffmpeg -nostdin -loglevel error -y -i "$RUNNER_TEMP/completo.mp3" \
            -t 180 -c copy "$HOME/Downloads/Sessão teste.mp3"
          sed -i.bak 's/^MODELO_FIEL=.*/MODELO_FIEL="small"/' ~/.config/tce/config
          printf '1\n' | ~/.local/bin/tce arquivo
          f="$(ls ~/Downloads/TCE-Transcricoes/*.txt | head -1)"
          cat "$f"
          grep -qi catilina "$f"
          mkdir -p saida && cp "$f" saida/
      - name: Caminho arrastado do Finder (bash 3.2 do próprio macOS)
        run: |
          /bin/bash --version | head -1
          /bin/bash -uc 'eval "$(sed -n "/^limpar_caminho/,/^}/p" tce/tce)"
            r="$(limpar_caminho "$HOME/Downloads/Sessão\ teste.mp3 ")"; echo "[$r]"; [ -f "$r" ]'
      - name: Velocidade, ajuda, modelos e atalho
        run: |
          ~/.local/bin/tce velocidade
          ~/.local/bin/tce ajuda | sed -n 1,6p
          ~/.local/bin/tce modelos
          ~/.local/bin/tce pasta
          cat ~/.zshrc
          ls -la ~/Desktop/*.command 2>/dev/null || echo "(sem Mesa no runner)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-mac
          path: saida
